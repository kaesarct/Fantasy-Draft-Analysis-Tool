server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10M;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Proxy interno verso il backend FastAPI (raggiungibile solo nella rete Docker,
    # mai esposto direttamente sull'host).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Loghi squadra caricati sul backend (app.mount("/static/logos", ...)).
    location /static/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # Ogni build Angular produce file col nome legato al contenuto (main-XXXXXXXX.js,
    # chunk-XXXXXXXX.js, ...) e cancella quelli della build precedente. Cache lunga, e un
    # file mancante deve dare 404: se ricadesse su index.html il browser, che si aspetta
    # JavaScript, darebbe "Expected a JavaScript module script ... text/html" e le pagine
    # caricate a richiesta smetterebbero di aprirsi dopo un deploy.
    # (add_header in un location annulla quelli del server: gli header di sicurezza si ripetono.)
    location ~ "-[A-Z0-9]{8}\.(js|css)$" {
        try_files $uri =404;
        # senza "always": la cache lunga vale solo per le risposte riuscite, mai per un 404
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # index.html punta ai file della build corrente: il browser deve riverificarlo sempre,
    # altrimenti dopo un deploy continua a usare i riferimenti della versione precedente.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # SPA Angular: qualsiasi altra route ricade su index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
